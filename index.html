<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MicroBlog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>MicroBlog</h1>

        <p class="subtitle">
            Share your thoughts with the world.
        </p>

        <!-- LOGIN -->
        <div id="loginSection" class="card">

            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button onclick="login()">
                Login
            </button>

            <p>
                Don't have an account?
                <button
                    class="linkButton"
                    onclick="showRegister()">
                    Register
                </button>
            </p>

        </div>


        <!-- REGISTER -->
        <div id="registerSection"
             class="card hidden">

            <h2>Create Account</h2>

            <input
                type="text"
                id="registerUsername"
                placeholder="Username"
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
            >

            <button onclick="register()">
                Register
            </button>

            <p>
                Already have an account?
                <button
                    class="linkButton"
                    onclick="showLogin()">
                    Login
                </button>
            </p>

        </div>


        <!-- HOME -->
        <div id="homeSection"
             class="hidden">

            <div class="topBar">

                <h2>Home Feed</h2>

                <button
                    class="logoutButton"
                    onclick="logout()">
                    Logout
                </button>

            </div>


            <!-- CREATE POST -->
            <div class="card">

                <h3>What's happening?</h3>

                <textarea
                    id="postContent"
                    maxlength="280"
                    placeholder="Write your post...">
                </textarea>

                <div class="postBottom">

                    <span id="characterCount">
                        0 / 280
                    </span>

                    <button onclick="createPost()">
                        Post
                    </button>

                </div>

            </div>


            <!-- USERS -->
            <div class="card">

                <h3>People to Follow</h3>

                <div id="usersList"></div>

            </div>


            <!-- FEED -->
            <div>

                <h3>Your Feed</h3>

                <div id="feed"></div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
